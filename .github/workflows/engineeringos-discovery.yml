name: EngineeringOS discovery quality

on:
  pull_request:
    paths:
      - "projects/engineeringos/**"
      - ".github/workflows/engineeringos-discovery.yml"
  push:
    branches:
      - main
    paths:
      - "projects/engineeringos/**"
      - ".github/workflows/engineeringos-discovery.yml"

permissions:
  contents: read

jobs:
  discovery-quality:
    name: Discovery tests and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run automated tests
        run: >-
          python -m unittest discover
          -s projects/engineeringos/tests
          -p "test_*.py"
          -v

      - name: Validate discovery contract
        run: python projects/engineeringos/tools/validate_discovery.py

      - name: Validate planning contract
        run: python projects/engineeringos/tools/validate_planning.py
